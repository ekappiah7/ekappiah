<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5eee0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a1810" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A family ledger: what came in, what went out, and what that means.">
  <title>Family Ledger</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./vendor/fonts/Inter-latin.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./vendor/fonts/PlayfairDisplay-latin.woff2">
  <link rel="stylesheet" href="./vendor/fonts/fonts.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128176;</text></svg>">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <a class="brand" href="#home" aria-label="Family Ledger — home">
        <span class="brand-mark" aria-hidden="true">AK</span>
        <span class="brand-word">Family Ledger</span>
      </a>
      <div class="app-bar-right">
        <span id="sync-badge" class="sync-badge"></span>
        <button class="pill-btn" data-action="theme" id="theme-btn" aria-label="Switch theme"></button>
        <button class="icon-btn" data-action="menu" aria-label="More views">☰</button>
      </div>
    </div>
    <nav id="menu" class="menu" hidden>
      <button data-menu-view="budgets">Budgets</button>
      <button data-menu-view="recurring">Recurring</button>
      <button data-menu-view="import">Import</button>
      <button data-menu-view="settings">Settings</button>
    </nav>
  </header>

  <main class="main">
    <h1 id="view-title" class="page-title">Overview</h1>
    <div id="view" class="view"></div>
  </main>

  <button id="add-btn" class="add-btn" aria-label="Add an entry">+</button>

  <nav class="tabbar">
    <button class="tab is-active" data-view="home"><span class="tab-icon">◎</span>Overview</button>
    <button class="tab" data-view="ledger"><span class="tab-icon">☰</span>Ledger</button>
    <button class="tab" data-view="insights"><span class="tab-icon">◨</span>Insights</button>
    <button class="tab" data-view="settings"><span class="tab-icon">⚙</span>Settings</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
